name: CI

# Clean-room build verification (Linear 0X3-31 / P2-05).
#
# The original AC asked for a build "on a machine that did not author the
# fix" -- not a real gate for a solo implementer. This workflow is the
# actual mechanism: every push gets a genuinely fresh GitHub-hosted runner
# (fresh checkout, fresh toolchain install, no local state carried over from
# any prior run) instead of a trust-me claim. No dependency or build caching
# is used here on purpose -- adding it back would quietly reintroduce the
# "stale local state" problem this workflow exists to rule out.

on:
  push:
    branches: [main]
  pull_request:

# Private repo, metered Actions minutes. This dedupes two independent
# sources of wasted runs: (1) pushing several times in a row leaves earlier,
# superseded runs grinding away instead of being cancelled, and (2) a push
# to a branch with an open PR fires both a `push` run and a `pull_request`
# synchronize run for the same commit. Those two land in different
# concurrency groups on their own (github.ref is refs/heads/<branch> for
# push vs. refs/pull/<n>/merge for pull_request), so the concurrency block
# alone can't merge them -- restricting `push` to `main` is what actually
# stops the pair, since feature-branch commits then only trigger the
# pull_request run. Convention on this initiative is to open the PR early
# and land commits into it, so every active branch has one; a branch with
# no open PR gets no CI, which is accepted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Default-feature build and test. This is the crate's real, supported
  # surface and must always pass cleanly on a from-scratch checkout.
  default-build-test:
    name: Default features (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Record clone-to-green start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build (default features)
        run: cargo build --locked --verbose

      - name: cargo test (default features)
        run: cargo test --locked --verbose

      - name: Record clone-to-green time
        run: |
          END_EPOCH=$(date +%s)
          ELAPSED=$((END_EPOCH - CI_START_EPOCH))
          echo "Clone-to-green (fresh checkout -> default build+test passing): ${ELAPSED}s" | tee -a "$GITHUB_STEP_SUMMARY"

  # Builds against the exact MSRV declared in Cargo.toml's `rust-version`
  # (P2-09 / Linear 0X3-35). Determined empirically, not guessed: Rust 1.84.0
  # fails outright (block-buffer v0.12.1 requires the `edition2024` Cargo
  # feature, stabilized in 1.85), while 1.85.0 builds and tests cleanly. This
  # job pins the toolchain to exactly that version -- not `stable` -- so it
  # goes red the moment a future change (this crate's code or a dependency
  # bump) relies on anything newer than the declared MSRV.
  msrv-build-test:
    name: MSRV (Rust 1.85.0, build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust 1.85.0 (exact MSRV toolchain, fresh, no cache)
        uses: dtolnay/rust-toolchain@1.85.0

      - name: cargo build (default features, MSRV toolchain)
        run: cargo build --locked --verbose

      - name: cargo test (default features, MSRV toolchain)
        run: cargo test --locked --verbose

  # Builds the actual advertised WASM artifact -- CRA-1 (Linear). This is
  # the exact invocation build.ps1 / build-wasm.ps1 run (minus wasm-pack's
  # JS/TS glue generation, which needs network access this job doesn't
  # bother with -- `cargo build` alone is enough to prove the cdylib links).
  # pqc-kem itself dropped `cdylib` from its crate-type as part of this fix
  # (see src/lib.rs and pqc-kem-wasm/Cargo.toml for why); this crate is the
  # one place in the repo that still needs one, and it's what this job
  # exercises.
  wasm-cdylib-build:
    name: pqc-kem-wasm (wasm32 cdylib artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache, wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cargo build --target wasm32-unknown-unknown --no-default-features
        working-directory: pqc-kem-wasm
        run: cargo build --target wasm32-unknown-unknown --no-default-features --locked --verbose

  # Regression test for CRA-1's actual defect -- the important part per the
  # ticket. Building pqc-kem by itself, even for wasm32, never reproduces
  # this: it only shows up from a *consumer's* build graph, where something
  # else in the graph links real std (here, a sibling `getrandom` dependency
  # with its `js` feature) alongside pqc-kem consumed as an ordinary no_std
  # library. Must fail on the pre-CRA-1 crate, must pass after. See
  # tests/downstream-consumer-fixture/Cargo.toml for the full writeup of the
  # two independent ways this used to fail (duplicate lang items from the
  # unconditional #[panic_handler]/#[global_allocator], and separately --
  # discovered while fixing the first -- pqc-kem's mandatory cdylib output
  # needing lang items no ordinary library consumer would think to supply).
  downstream-consumer:
    name: Downstream consumer (no_std + external std leak, wasm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache, wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cargo build --target wasm32-unknown-unknown
        working-directory: tests/downstream-consumer-fixture
        run: cargo build --target wasm32-unknown-unknown --locked --verbose

  # `hqc` is now REAL and working (P2/alpha-001 HQC implementation pass --
  # see src/hqc/mod.rs module docs and README.md "Why liboqs and not
  # pqcrypto-hqc?" for the full writeup). Unlike the default-features job,
  # this needs a C toolchain, cmake, and libclang (for bindgen) to build
  # liboqs's vendored HQC sources -- verified NOT to additionally require
  # OpenSSL when only `hqc` (not oqs's kems/sigs/openssl default groups) is
  # enabled. ubuntu-latest is expected to already have cmake/clang, so no
  # extra apt-get install step is included here; if this job goes red on
  # missing tools rather than a real code issue, that's the first thing to
  # check.
  hqc-feature-build-test:
    name: hqc feature (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --features hqc
        run: cargo build --features hqc --locked --verbose

      - name: cargo test --features hqc
        run: cargo test --features hqc --locked --verbose

      # WP3 (X-3/A-D1): this is the one runner in the matrix with a C
      # toolchain/cmake/libclang available, so it's the only place
      # `cargo doc --features hqc` can actually run -- doc'ing the hqc
      # module's real (feature-gated) types needs the feature enabled.
      # Kept as its own -D warnings check separate from clippy-and-doc
      # below, which only covers default features.
      - name: cargo doc --features hqc (-D warnings)
        run: cargo doc --no-deps --features hqc --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # 0.3.0 (WP1, feature-surface hygiene): `bike` and `mceliece` were each a
  # permanent `compile_error!` stub -- neither was ever implemented -- and
  # have now been REMOVED entirely (feature flags, `src/bike`/`src/mceliece`
  # modules, and the `pqcrypto-classicmceliece`/`pqcrypto-traits`
  # dependencies that dragged in three RUSTSEC `unmaintained` advisories).
  # `--all-features` therefore now enables only `hqc` (a real, working
  # implementation -- see hqc-feature-build-test above) and is expected to
  # build and test cleanly, like any other supported feature combination.
  # This job replaces the old `all-features-must-fail-cleanly` job, which
  # asserted the opposite (must fail with exactly two named compile_error!s)
  # -- see CHANGELOG.md's 0.3.0 entry for the full writeup.
  all-features-build-test:
    name: --all-features (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --all-features
        run: cargo build --all-features --locked --verbose

      - name: cargo test --all-features
        run: cargo test --all-features --locked --verbose

  # Builds and tests the actual PACKAGED artifact (what `cargo add` /
  # crates.io consumers get), not the working tree. `cargo package`
  # re-verifies by extracting the package into target/package/<name>-<ver>/
  # and building there; we then run tests from that same extracted
  # directory so both build and test exercise what .gitignore/exclude rules
  # actually ship, not the live source tree.
  packaged-artifact:
    name: Packaged artifact (cargo package build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo package --list (inspect what ships)
        run: cargo package --list --locked

      - name: cargo package (build + verify the packaged artifact)
        run: cargo package --locked

      - name: Locate extracted package directory
        id: pkg
        run: |
          PKG_DIR=$(find target/package -maxdepth 1 -type d -name 'pqc-kem-*' | head -n1)
          if [ -z "$PKG_DIR" ]; then
            echo "::error::Could not find extracted package directory under target/package/"
            exit 1
          fi
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"

      - name: cargo test against the packaged artifact
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: cargo test --locked --verbose

  # WP3 (X-3): the `no_std` + `alloc`-only claim ("What runs today" /
  # "Feature Flags" in README.md) was previously enforced only by
  # verify-gates.ps1, run manually/locally -- never by CI itself. This job
  # makes that claim CI-enforced. Uses the same fresh-runner, no-cache
  # pattern as every other job here.
  no-std-build:
    name: no_std build + test (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --no-default-features
        run: cargo build --no-default-features --locked --verbose

      - name: cargo test --no-default-features
        run: cargo test --no-default-features --locked --verbose

  # WP3 (X-3/A-D1): lint and doc-link hygiene, previously only run
  # ad-hoc/locally. `cargo doc` runs with RUSTDOCFLAGS="-D warnings" so a
  # regression in intra-doc links (the 9 `broken_intra_doc_links` warnings
  # fixed in this work package -- see CHANGELOG.md's 0.3.0 entry) fails CI
  # instead of silently reappearing. Default features only here; the
  # `hqc`-feature doc check lives in hqc-feature-build-test above, the one
  # runner in this workflow with the C toolchain/cmake/libclang `hqc` needs.
  clippy-and-doc:
    name: clippy + rustdoc (-D warnings, default features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache, clippy component)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo doc --no-deps (-D warnings, default features)
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  # WP3 (X-3): builds `pqc-kem` for wasm32-unknown-unknown (both this crate
  # directly, redundant with wasm-cdylib-build's coverage of the sibling
  # crate but cheap and explicit) and the pqc-kem-wasm cdylib for the same
  # target, then additionally tries wasm32-wasip1 for the root crate.
  # wasm32-wasip1 was verified locally to build cleanly with
  # --no-default-features (no getrandom-backend blocker was found for this
  # crate's own dependency graph on that target); if a future dependency
  # bump makes that stop being true, this job is the one that will catch
  # it -- update README.md's "Per-target support matrix" (X-3) accordingly
  # rather than deleting the step. wasm32-wasip2 is not included here: it
  # was verified to build locally too, but is left as a locally-verified,
  # not CI-enforced, claim in the README matrix for now (kept to a minimal
  # diff for this work package).
  wasm-targets:
    name: WASM target matrix (wasm32-unknown-unknown + wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache, wasm targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: cargo build --target wasm32-unknown-unknown --no-default-features (pqc-kem)
        run: cargo build --target wasm32-unknown-unknown --no-default-features --locked --verbose

      - name: cargo build --target wasm32-unknown-unknown --no-default-features (pqc-kem-wasm)
        working-directory: pqc-kem-wasm
        run: cargo build --target wasm32-unknown-unknown --no-default-features --locked --verbose

      - name: cargo build --target wasm32-wasip1 --no-default-features (pqc-kem)
        run: cargo build --target wasm32-wasip1 --no-default-features --locked --verbose

  # WP3 (X-3): the WASM JS API regression test (tests/wasm_api_test.mjs)
  # previously had no CI job at all -- it could only bit-rot silently
  # (which is exactly what happened to its version-string assertion,
  # A-D1). This builds the same dist/ artifact build.ps1 produces, via the
  # equivalent raw wasm-pack invocation (bash, not PowerShell), then runs
  # the Node test against it.
  wasm-pack-node-test:
    name: wasm-pack + node (WASM API regression test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache, wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build (same invocation as build.ps1, translated to bash)
        working-directory: pqc-kem-wasm
        run: wasm-pack build --target web --out-dir ../dist --release -- --no-default-features

      - name: node tests/wasm_api_test.mjs
        run: node tests/wasm_api_test.mjs

  # WP4 (X-4/P1): Known-Answer Tests against published NIST ACVP ML-KEM
  # vectors and RFC 7748 X25519 vectors (see
  # tests/vectors/README.md
  # for provenance). The `kat` feature is non-default and additive -- gates
  # a handful of deterministic, testing-only entry points
  # (MlKem*Keypair::from_seed_halves/encapsulate_deterministic/
  # from_expanded_decapsulation_key_bytes/to_expanded_decapsulation_key_bytes,
  # fips203::hybrid::x25519_kat) -- so both a default-features build and a
  # --no-default-features (no_std) build are checked here, matching the
  # no-std-build job's coverage for the rest of the crate.
  kat-feature-build-test:
    name: kat feature (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fresh clone, no cache)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (fresh, no cache)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --features kat
        run: cargo build --features kat --locked --verbose

      - name: cargo test --features kat
        run: cargo test --features kat --locked --verbose

      - name: cargo build --no-default-features --features kat
        run: cargo build --no-default-features --features kat --locked --verbose

      - name: cargo test --no-default-features --features kat
        run: cargo test --no-default-features --features kat --locked --verbose
