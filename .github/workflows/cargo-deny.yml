name: cargo-deny

# Dependency advisory / license / ban / source scanning (Linear 0X3-33 / P2-07).
#
# HISTORY (until 0.3.0): this workflow was EXPECTED TO FAIL. P1-06 ran
# cargo-deny for real against this crate and the `advisories` check FAILED:
# the PQClean project (upstream C implementations behind the `pqcrypto-*`
# family) was being archived, so three transitively-reachable crates
# (`pqcrypto-traits`, `pqcrypto-internals`, `pqcrypto-classicmceliece`),
# reachable only through the non-default, never-implemented `mceliece`
# feature, carried `unmaintained` advisories. Ed's recorded decision
# (P1-06, 2026-08-24) was ACCEPT AND DOCUMENT, not suppress, with
# `deny.toml`'s `advisories.ignore` left EMPTY on purpose.
#
# 0.3.0 (WP1, feature-surface hygiene) REMOVED the `mceliece` (and `bike`)
# features/modules and their `pqcrypto-*` dependencies entirely -- see
# CHANGELOG.md's 0.3.0 entry and SECURITY.md. Those three advisories are no
# longer reachable in any configuration of this crate, so this workflow is
# now expected to PASS ("hard-fail" -- a genuinely red run here means a
# real, current problem, not an already-accepted historical one).
#
# This still lives in its own workflow file rather than in ci.yml so a
# transient upstream advisory-database hiccup or a newly-filed advisory
# doesn't couple to the main CI badge; it is not a "soft" or
# continue-on-error check, and a failure here should be treated as a real
# gate, not background noise.
#
# Do not add `continue-on-error: true`. Do not add entries to
# `advisories.ignore` to paper over a real finding -- record the decision
# in SECURITY.md instead if something new needs to be accepted.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new advisory surfaces without anyone remembering to look --
    # the whole reason this doesn't only run at publish time (P1-06).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      # A failure on any one check still runs the rest -- advisories, bans,
      # licenses, and sources are independent questions and one shouldn't
      # hide the others. `fail-fast: false` is what actually delivers that;
      # `continue-on-error` would instead report the failing job as GREEN,
      # burying the signal and (because `failure()` would never fire)
      # silently disabling the issue-filing job below.
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          # Overrides the action's `--all-features` default. Not a loss:
          # deny.toml sets `all-features = true` under [graph] itself, so the
          # full opt-in surface (hqc, bike, mceliece) is still scanned -- and
          # it's scanned that way for anyone running cargo-deny locally too,
          # not just in CI.
          arguments: --config deny.toml

  # A failing advisory must do more than turn a run red -- it needs a
  # tracking issue so it doesn't get missed on a crate where a red run used
  # to be the accepted steady state (pre-0.3.0; see header comment above).
  #
  # Excludes `pull_request`: a PR from a fork gets a read-only GITHUB_TOKEN, so
  # `issues: write` isn't grantable and this job would fail on permissions
  # rather than on anything real. PR runs still go red, which is the point of a
  # PR run; push and the weekly cron are what file the issue.
  open-issue-on-failure:
    name: File/refresh tracking issue
    needs: cargo-deny
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update issue for failing cargo-deny scan
        uses: actions/github-script@v7
        with:
          script: |
            const title = "cargo-deny scan failed";

            // The weekly cron is the heartbeat: it comments every time so
            // there's a dated trail even while the issue stays open. Push
            // and manual runs only OPEN the issue if none exists -- with a
            // permanently-failing advisories check, commenting on every
            // push to main would bury the issue in noise.
            const isHeartbeat = context.eventName === "schedule";

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security,cargo-deny",
            });
            const already = existing.find(i => i.title === title);

            if (already && !isHeartbeat) {
              core.info(`Issue #${already.number} is already open; not commenting for a ${context.eventName} run.`);
              return;
            }

            const body = [
              `A \`cargo-deny\` run failed (event: \`${context.eventName}\`).`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Check the run output for which category (advisories / bans / licenses /`,
              `sources) failed.`,
              ``,
              `As of 0.3.0 this workflow is expected to be GREEN -- the` ,
              `\`mceliece\`/\`bike\` features and their \`pqcrypto-*\` dependencies that`,
              `previously caused three known/accepted advisories were removed entirely`,
              `(see CHANGELOG.md's 0.3.0 entry). Treat any failure here as a real,`,
              `current finding, not an already-accepted historical one.`,
              ``,
              `Record the decision -- resolved, accepted, or blocking -- in SECURITY.md.`,
            ].join("\n");

            if (already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: already.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security", "cargo-deny"],
              });
            }
