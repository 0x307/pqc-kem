[package]
name        = "pqc-kem"
version     = "0.3.0"
edition     = "2021"
rust-version = "1.85"
authors     = ["Kenneth Harper"]
description = "Post-quantum Key Encapsulation Mechanisms: ML-KEM (FIPS 203) and the X25519+ML-KEM-768 hybrid; optional native-only HQC via liboqs — no_std library, WASM-compatible"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/0x307/pqc-kem"
keywords    = ["post-quantum", "kem", "ml-kem", "wasm", "cryptography"]
categories  = ["cryptography", "wasm"]

# What ships to crates.io, as an allowlist rather than cargo's default of
# "every tracked file".
#
# The default publishes whatever happens to be committed, which on the way to
# 0.3.0 came to include a dozen scratch files at the repository root. An
# allowlist turns the next stray file into a non-event: it is simply not
# listed.
#
# Test sources, vector data and the lockfile are here because CI builds and
# tests the *packaged* crate, not the checkout, and the KATs read their
# vectors from `tests/vectors/`. Deliberately not `tests/**`: that would also
# ship the vector-regeneration script and the wasm-pack test, maintainer
# tools that are useless inside a crate and that have carried
# workstation-specific paths before. Nested packages (`pqc-kem-wasm/`,
# `tests/downstream-consumer-fixture/`) are excluded by cargo automatically
# regardless of what this list says.
include = [
    "/src/**",
    "/tests/*.rs",
    "/tests/vectors/**/*.json",
    "/tests/vectors/README.md",
    "/benches/**",
    "/wit/**",
    "/docs/hybrid-profiles.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/BENCHMARKS.md",
    "/SECURITY.md",
    "/STABILITY.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[lib]
name       = "pqc_kem"
crate-type = ["rlib"]

# ── Core PQC — Pure Rust, no_std capable, WASM-compatible ────────────────────

[dependencies]
# NIST FIPS 203 — ML-KEM-512/768/1024 (pure Rust, audited, no_std)
#
# `zeroize` feature (A-Z1, 0.3.0): ml-kem 0.3.2 gates a real `Drop` impl for
# `DecapsulationKey<P>` behind this feature (it zeroizes the seed (`d`), the
# implicit-rejection value (`z`), and the expanded decryption key on drop —
# see `decapsulation_key.rs` upstream). Without it, ML-KEM secret key
# material was never zeroized. `alloc` was already enabled (required either
# way for this crate's `Vec<u8>`-based wire types).
ml-kem = { version = "0.3", default-features = false, features = ["alloc", "zeroize"] }

# Classical hybrid component — X25519 (pure Rust, no_std)
#
# `zeroize` feature (A-Z1, 0.3.0): without it, `x25519-dalek`'s `zeroize`
# dependency is not pulled in at all, so `StaticSecret`/`EphemeralSecret`
# carried no `Drop` impl and were never zeroized on drop. `default-features
# = false` is preserved — `zeroize` is additive, not a default-feature
# dependency, and stays `no_std`-compatible (it does not require `alloc`).
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }

# KDF — HKDF-SHA256 for hybrid shared secret derivation (pure Rust, no_std)
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

# SHA3-256 / SHAKE-256 for the X-Wing (HybridKem-X25519-MLKEM768-v2) combiner
# and decapsulation-key expansion (WP5/K-5, docs/hybrid-profiles.md). Pure
# Rust, no_std-compatible (RustCrypto, same `digest` trait family already in
# this graph via `sha2`/`hkdf`). `digest` is depended on directly (not just
# transitively through `sha3`) so `xwing.rs` can name its
# `Update`/`ExtendableOutput`/`XofReader`/`Digest` traits explicitly.
sha3 = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }

# Symmetric encryption post-KEM (pure Rust, no_std). Currently unused in
# `src/` -- it will move behind a new opt-in `aead-wrap` feature in a later
# work package (see docs/gap-analysis/pqc-kem-gap-roadmap.md §3.5). Kept
# non-optional for now; do not treat this as an unused-dep regression.
chacha20poly1305 = { version = "0.10", default-features = false }

# Encoding — no_std compatible
base64ct = { version = "1", default-features = false, features = ["alloc"] }

# Multibase encoding for DID Documents (bs58)
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

# RNG abstraction — caller provides RNG, no OsRng hardcoding
rand_core = { version = "0.6", default-features = false }

# Serialization — no_std with alloc
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Error handling — no_std compatible
thiserror = { version = "2", default-features = false }

# Zeroize secret key material on drop. `alloc` is enabled explicitly
# (rather than relying on feature unification from other dependencies in
# the graph) so `Vec<u8>: Zeroize`/`ZeroizeOnDrop` (used by `KemSecretKey`,
# `SharedSecret`, and the `hqc`-feature keypair types) is guaranteed
# available under every feature combination this crate supports, including
# `--no-default-features` (no_std + alloc).
zeroize = { version = "1", default-features = false, features = ["derive", "alloc"] }

# Optional: HQC (NIST 2025 standard) — real implementation via `liboqs`.
#
# `pqcrypto-hqc` was re-verified live during implementation (P2/alpha-001):
# the current published 0.2.x API DOES match this module's calls (the old
# "82 compile errors against pqcrypto-hqc 0.1" comment is stale -- 0.1 is no
# longer what gets resolved). However, live testing surfaced a more serious,
# *new* defect: `pqcrypto-hqc` 0.2.2's `decapsulate()` wraps the PQClean C
# reference's informational "decapsulation check failed" return code (the
# FO-transform's normal, expected implicit-rejection outcome for ANY
# ciphertext/secret-key mismatch -- not a rare adversarial edge case) in a
# hard `assert_eq!(.., 0)`, which panics/aborts the process instead of
# surfacing an error. That is unacceptable for a KEM whose whole purpose is
# decapsulating counterparty-supplied ciphertexts. `oqs` (liboqs-rust)
# wraps the identical underlying libc return code as a proper `Result`
# (verified live: neither a bit-flipped ciphertext nor an honestly
# mismatched secret key panics; both cleanly return `Err`). Byte sizes are
# identical between the two bindings (both wrap the same NIST HQC
# parameter sets), so this is a drop-in-equivalent, safer choice -- not a
# design compromise. See CHANGELOG.md and README.md for the full writeup.
#
# `hqc` alone (no `kems`/`sigs`/`openssl` default features) needs only a C
# toolchain + `cmake` + `libclang`(bindgen) to build liboqs's vendored HQC
# sources -- verified NOT to require OpenSSL when scoped this narrowly.
oqs = { version = "0.11", default-features = false, features = ["hqc", "std"], optional = true }

[features]
default = ["std"]

# std: enables std-dependent trait impls
std = [
    "sha2/std",
    "hkdf/std",
    "serde/std",
    "serde_json/std",
    "zeroize/std",
    "ml-kem/getrandom",
]

# hqc: HQC-128/192/256 — real implementation via `liboqs` (the `oqs` crate).
# Native targets only (C FFI); not wasm32-unknown-unknown compatible.
hqc = ["dep:oqs"]

# kat: deterministic, testing/interop-only entry points needed to check this
# crate's ML-KEM output against published Known-Answer-Test vectors (X-4/P1,
# see docs/gap-analysis/pqc-kem-gap-roadmap.md §3.7 and tests/vectors/README.md).
# Adds a handful of extra methods to MlKem{512,768,1024}Keypair
# (from_seed_halves, encapsulate_deterministic,
# from_expanded_decapsulation_key_bytes, to_expanded_decapsulation_key_bytes)
# and one free function (fips203::hybrid::x25519_kat). All are rustdoc'd as
# testing/interop only and MUST NOT be used for production key generation or
# key exchange. Adds no new dependencies (reuses `ml-kem`'s and
# `x25519-dalek`'s existing public API); no_std/alloc-compatible.
kat = []

# CRA-1: this crate is deliberately rlib-only now (see [lib] crate-type
# above and src/lib.rs) -- a pure Rust/no_std library meant to be imported
# into other builds, never built standalone on its own. There is no more
# `wasm`-bindings surface or `standalone` feature here to document specially
# for docs.rs: `hqc` can't build there regardless (native C toolchain/cmake/
# libclang, unavailable in docs.rs's sandbox). Default features are enough;
# no [package.metadata.docs.rs] override needed. The WASM bindings that used
# to live here moved to the sibling `pqc-kem-wasm` crate.
#
# 0.3.0: the `bike` and `mceliece` features (each a permanent
# `compile_error!` stub — neither was ever implemented) were removed
# entirely, along with their `src/bike`/`src/mceliece` modules and the
# `pqcrypto-classicmceliece`/`pqcrypto-traits` dependencies. `--all-features`
# now builds and tests cleanly. See CHANGELOG.md's 0.3.0 entry.

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `ml-kem/getrandom` (enabled by our `std` feature) transitively pulls
# getrandom 0.4 via crypto-common, and 0.4 refuses wasm32-unknown-unknown
# unless its `wasm_js` crate feature is enabled (CRA-1, defect 2). Target-
# conditional so ANY consumer building this crate for wasm32 -- not just
# `pqc-kem-wasm` -- gets a working entropy backend with no feature flag to
# remember. Inert (not even compiled) on every other target.
getrandom = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rand = "0.8"
hex-literal = "0.4"

# Used directly (not via this crate's own wrappers) by
# tests/kat_hybrid_v1.rs's independent low-level recomputation of one hybrid
# v1 vector — see docs/hybrid-profiles.md "Test-vector format and
# provenance" and tests/vectors/README.md. Same versions/feature sets as the
# equivalent normal dependencies above; adding them here too is additive
# (cargo unifies the feature sets for the same package/target).
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ml-kem = { version = "0.3", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

# `panic = "abort"` matters when THIS crate is the one being built directly
# (root package) -- e.g. `cargo test --no-default-features`: the test
# harness binary is a genuine final linked artifact, and core's unwind
# runtime isn't available without std. Profile settings don't propagate to
# downstream consumers, so this has no effect on anyone depending on
# pqc-kem as a library. Acceptable here since nothing in this crate uses
# `#[should_panic]` or `catch_unwind`.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
